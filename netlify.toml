# Netlify configuration.
#
# Build command and publish directory are deliberately NOT set here — Netlify's
# Next.js detection already handles them, and duplicating that config in two
# places is how the two drift apart.
#
# SECURITY HEADERS ARE NOT HERE. They live in next.config.ts, and that is not a
# style preference. Netlify applies these [[headers]] rules to files it serves
# from the CDN; every HTML document on this site is produced by the Next server
# handler and never passes through them. Putting the CSP here produced a policy
# that was present on every .js chunk and absent on every page — the exact
# opposite of what protects anyone. Cache-Control is the one thing that genuinely
# belongs at this layer, because it applies to precisely the static files below.

# Next emits content-hashed filenames under /_next/static, so these can be cached
# hard and forever. A new build produces new names.
[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
